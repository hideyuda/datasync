name: Teams Sync

on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          TEAMS_TENANT_ID: ${{ secrets.TEAMS_TENANT_ID }}
          TEAMS_CLIENT_ID: ${{ secrets.TEAMS_CLIENT_ID }}
          TEAMS_CLIENT_SECRET: ${{ secrets.TEAMS_CLIENT_SECRET }}
          TEAMS_TEAM_IDS: ${{ vars.TEAMS_TEAM_IDS }}
          TEAMS_CHANNEL_IDS: ${{ vars.TEAMS_CHANNEL_IDS }}
          TEAMS_FROM_DAYS: ${{ vars.TEAMS_FROM_DAYS }}
          TEAMS_INCLUDE_REPLIES: ${{ vars.TEAMS_INCLUDE_REPLIES }}
        run: |
          python src/sync_teams.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(sync): teams $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
