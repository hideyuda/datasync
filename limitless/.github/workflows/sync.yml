name: Limitless Sync

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
          LIMITLESS_FROM_DAYS: ${{ vars.LIMITLESS_FROM_DAYS }}
          LIMITLESS_TIMEZONE: ${{ vars.LIMITLESS_TIMEZONE }}
          LIMITLESS_INCLUDE_CONTENTS: ${{ vars.LIMITLESS_INCLUDE_CONTENTS }}
          LIMITLESS_INCLUDE_AUDIO: ${{ vars.LIMITLESS_INCLUDE_AUDIO }}
        run: |
          python src/sync_limitless.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(sync): limitless $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
