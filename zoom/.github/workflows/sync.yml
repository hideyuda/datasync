name: Zoom Sync

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          ZOOM_USER_IDS: ${{ vars.ZOOM_USER_IDS }}
          ZOOM_FROM_DAYS: ${{ vars.ZOOM_FROM_DAYS }}
          ZOOM_DOWNLOAD_RECORDINGS: ${{ vars.ZOOM_DOWNLOAD_RECORDINGS }}
        run: |
          python src/sync_zoom.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(sync): zoom $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
